<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Aluno</title>
    <link rel="stylesheet" href="cadastro-aluno.css">
</head>
<body>
    <header class="cabecalho">
        <h1 id="headerAVA">AVA Educa+</h1>
        <div id="nomeUsuario">
            <p id="usuarioAtual">Bem-vindo, estudante.</p>
            <img src="../assets/images/usuario_AVAEDUCA+.avif" alt="Foto de perfil">
        </div>
    </header>
    <main class="conteudo">
        <section id="menuLateral">
            <h1>Menu</h1>
            <button class="botaoMenu" id="botaoDashboard">Dashboard</button>
            <button class="botaoMenu" id="botaoCursos">Meus cursos</button>
            <button class="botaoMenu" id="botaoCadastro">Cadastrar aluno</button>
            <button class="botaoMenu" id="botaoSair">Sair</button>
        </section>
        <div id="areaCadastro">
            <section id="introdCadastro">
                <h1>Cadastre um Aluno</h1>
                <p>Preencha as informações abaixo para efetuar o cadastro.</p>
            </section>
            <section id="formCadastro">
                <form id="cadastro">
                    <div id="campoPessoal">
                        <label for="nome">Nome completo:</label>
                        <input type="text" id="nome" placeholder="Digite o nome completo (do aluno)" required>
                        <label for="genero">Gênero:</label>
                        <select id="genero" required>
                            <option value="masculino">Masculino</option>
                            <option value="feminino">Feminino</option>
                            <option value="outro">Outro</option>
                        </select>
                        <label for="dataNasc">Data de nascimento:</label>
                        <input type="date" id="dataNasc" required>
                        <label for="cpf">CPF:</label>
                        <input type="text" id="cpf" placeholder="Digite o CPF" required>
                        <label for="telefone">Número de telefone:</label>
                        <input type="tel" id="telefone" placeholder="Digite o número de telefone" required>
                        <label for="email">Email:</label>
                        <input type="email" id="email" placeholder="Digite o email" required>
                    </div>
                    <div id="campoEndereco">
                        <h2>Endereço:</h2>
                        <section id="secaoCEP">
                            <label for="cep">CEP:</label>
                            <input type="text" id="cep" placeholder="Digite o CEP" required>
                        </section>
                        <section id="secaoCidade">
                            <label for="cidade">Cidade:</label>
                            <input type="text" id="cidade" placeholder="Digite a cidade" required>
                        </section>
                        <section id="secaoEstado">
                            <label for="estado">Estado:</label>
                            <input type="text" id="estado" placeholder="Digite o estado" required>
                        </section>
                        <section id="secaoLogradouro">
                            <label for="logradouro">Logradouro:</label>
                            <input type="text" id="logradouro" placeholder="Digite o logradouro (Rua, Av.)" required>
                        </section>
                        <section id="secaoNumero">
                            <label for="numero">Número:</label>
                            <input type="text" id="numero" placeholder="Digite o número" required>
                        </section>
                        <section id="secaoBairro">
                            <label for="bairro">Bairro:</label>
                            <input type="text" id="bairro" placeholder="Digite o bairro" required>
                        </section>
                        <section id="secaoComplemento">
                            <label for="complemento">Complemento:</label>
                            <input type="text" id="complemento" placeholder="Digite o complemento (opcional)">
                        </section>
                    </div>
                    <button type="submit" id="botaoCadastroEnviar">Cadastrar aluno</button>
                </form>
            </section>
        </div>
    </main>
</body>
</html>
