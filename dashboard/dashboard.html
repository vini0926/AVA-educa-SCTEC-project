<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <header class="cabecalho">
        <h1 id="headerAVA">AVA Educa+</h1>
        <div id="nomeUsuario">
            <p id="usuarioAtual">Bem-vindo, estudante.</p>
            <img src="../assets/images/usuario_AVAEDUCA+.avif" alt="Foto de perfil">
        </div>
    </header>
    <main class="conteudo">
        <section id="menuLateral">
            <h1>Menu</h1>
            <button class="botaoMenu" id="botaoDashboard">Dashboard</button>
            <button class="botaoMenu" id="botaoCursos">Meus cursos</button>
            <button class="botaoMenu" id="botaoCadastro">Cadastrar aluno</button>
            <button class="botaoMenu" id="botaoSair">Sair</button>
        </section>
        <div id="areaCursos">
            <section id="MeusCursos">
                <h1>Meus cursos</h1>
            </section>
            <section class="cursos">
                <div class="Cardcurso">
                    <h2 class="Cardtitulo">Placeholder</h2>
                    <p class="Cardtexto">CardTesteCardTesteCardTesteCardTeste</p>
                    <p class="Carddata">Início: [data inicio]<br>Fim: [data fim]</p>
                </div>
            </section>
        </div>
    </main>
</body>
</html>
