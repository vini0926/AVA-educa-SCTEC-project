<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="dashboard.css">
    <script src="../dados/listagem-cursos.js" defer></script>
    <script src="../js/cursos.js" defer></script>
    <script src="dashboard.js" defer></script>
</head>
<body>
    <header class="cabecalho">
        <h1 id="headerAVA">AVA Educa+</h1>
        <div id="nomeUsuario">
            <p id="usuarioAtual">Bem-vindo, usuário.</p>
            <img src="../assets/images/usuario_AVAEDUCA+.avif" alt="Foto de perfil">
        </div>
    </header>
    <main class="conteudo">
        <section id="menuLateral">
            <h1>Menu</h1>
            <button class="botaoMenu" id="botaoDashboard">Dashboard</button>
            <button class="botaoMenu" id="botaoCursos">Meus cursos</button>
            <button class="botaoMenu" id="botaoCadastro">Cadastrar aluno</button>
            <button class="botaoMenu" id="botaoSair">Sair</button>
        </section>
        <div id="areaCursos">
            <section id="MeusCursos">
                <h1>Meus cursos</h1>
                <p>Acesse os seus cursos abaixo.</p>
            </section>
            <section class="cursos">
            </section>
        </div>
    </main>
</body>
</html>
